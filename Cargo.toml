[package]
name = "splitwire"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SWP/1: engine-agnostic pipeline-split inference protocol + engine-free tools"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "=1.5.5"

[profile.release]
opt-level = 3
lto = "thin"
